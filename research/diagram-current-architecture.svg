<svg viewBox="0 0 1800 1100" role="img" aria-labelledby="svg-title svg-desc">
  <title id="svg-title">Current architecture for Lobster, llm-task, and the removed TaskFlow layer</title>
  <desc id="svg-desc">TaskFlow is historical. Direct llm-task calls provide bounded JSON judgment, deterministic helpers validate results, and Lobster owns workflow sequencing plus approval and resume. Native OpenClaw mechanisms replace the former TaskFlow responsibilities.</desc>
  <defs>
    <marker id="arrow-slate" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#b45309"/></marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#b91c1c"/></marker>
  </defs>

  <rect width="1800" height="1100" fill="#f8fafc"/>
  <text x="70" y="70" class="title">Lobster runs it. llm-task judges. TaskFlow is gone.</text>
  <text x="70" y="105" class="subtitle">The current OpenClaw architecture — plus the safe bridge that is actually proven in this lab.</text>

  <!-- Connectors drawn before nodes -->
  <path d="M430 215 H760" stroke="#94a3b8" stroke-width="3" stroke-dasharray="10 8" fill="none" marker-end="url(#arrow-slate)"/>
  <path d="M1010 215 H1310" stroke="#94a3b8" stroke-width="3" stroke-dasharray="10 8" fill="none" marker-end="url(#arrow-slate)"/>
  <text x="515" y="198" class="arrow-label" fill="#64748b">persisted historical state</text>
  <text x="1085" y="198" class="arrow-label" fill="#64748b">unused by current runtime</text>

  <path d="M850 275 V335" stroke="#0f172a" stroke-width="5" fill="none" marker-end="url(#arrow-slate)"/>
  <text x="880" y="310" class="arrow-label">removed — no compatibility facade</text>

  <path d="M365 665 H490" stroke="#475569" stroke-width="3" fill="none" marker-end="url(#arrow-slate)"/>
  <path d="M735 665 H865" stroke="#b45309" stroke-width="3" fill="none" marker-end="url(#arrow-amber)"/>
  <path d="M1110 665 H1240" stroke="#475569" stroke-width="3" fill="none" marker-end="url(#arrow-slate)"/>
  <path d="M1485 665 H1605" stroke="#6d28d9" stroke-width="3" fill="none" marker-end="url(#arrow-slate)"/>
  <text x="382" y="645" class="arrow-label">direct Gateway call</text>
  <text x="757" y="645" class="arrow-label">JSON judgments</text>
  <text x="1130" y="645" class="arrow-label">typed package</text>
  <text x="1500" y="645" class="arrow-label">approved</text>

  <path d="M610 760 C760 820 1030 820 1130 760" stroke="#b91c1c" stroke-width="3" stroke-dasharray="10 8" fill="none" marker-end="url(#arrow-red)"/>
  <text x="700" y="830" class="arrow-label" fill="#b91c1c">embedded Lobster → nested llm-task: unsupported / unproven bridge</text>

  <!-- Historical band -->
  <text x="70" y="155" class="band" fill="#64748b">THEN — THE OLD MENTAL MODEL</text>
  <rect x="70" y="175" width="360" height="105" rx="16" fill="#ffffff" stroke="#94a3b8" stroke-width="2" stroke-dasharray="9 7" opacity="0.62"/>
  <text x="95" y="214" class="node-title" fill="#64748b" text-decoration="line-through">TaskFlow orchestration API</text>
  <text x="95" y="244" class="node-body" opacity="0.7">One shared lifecycle and task-control surface</text>

  <rect x="760" y="175" width="250" height="105" rx="16" fill="#ffffff" stroke="#94a3b8" stroke-width="2" stroke-dasharray="9 7" opacity="0.62"/>
  <text x="785" y="214" class="node-title" fill="#64748b" text-decoration="line-through">Shared Tasks ledger</text>
  <text x="785" y="244" class="node-body" opacity="0.7">Removed from the runtime</text>

  <rect x="1310" y="175" width="400" height="105" rx="16" fill="#ffffff" stroke="#94a3b8" stroke-width="2" stroke-dasharray="9 7" opacity="0.62"/>
  <text x="1335" y="214" class="node-title" fill="#64748b">Old database rows may remain</text>
  <text x="1335" y="244" class="node-body" opacity="0.7">Residue only — current OpenClaw does not read them</text>

  <!-- Current owners band -->
  <text x="70" y="380" class="band" fill="#0f172a">NOW — PICK THE OWNER THAT MATCHES THE JOB</text>
  <rect x="70" y="400" width="430" height="155" rx="18" fill="#e2e8f0" stroke="#334155" stroke-width="3"/>
  <text x="100" y="445" class="node-title" fill="#0f172a">LOBSTER</text>
  <text x="100" y="478" class="node-body">Deterministic local workflow runner</text>
  <text x="100" y="505" class="node-body">sequence · branch · caps · approval · resume</text>
  <text x="100" y="533" class="small">Owns what happens next.</text>

  <rect x="530" y="400" width="430" height="155" rx="18" fill="#fffbeb" stroke="#b45309" stroke-width="3"/>
  <text x="560" y="445" class="node-title" fill="#92400e">llm-task</text>
  <text x="560" y="478" class="node-body">One fresh isolated JSON-only model call</text>
  <text x="560" y="505" class="node-body">optional schema · no memory · no orchestration</text>
  <text x="560" y="533" class="small">Owns bounded judgment.</text>

  <rect x="990" y="400" width="720" height="155" rx="18" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
  <text x="1020" y="438" class="node-title" fill="#0f172a">Former TaskFlow responsibilities now have native owners</text>
  <text x="1020" y="474" class="node-body">Subagents / history — delegated work</text>
  <text x="1020" y="501" class="node-body">ACP — coding harness sessions</text>
  <text x="1350" y="474" class="node-body">Automations — schedules + run history</text>
  <text x="1350" y="501" class="node-body">Hooks / webhooks — triggers</text>
  <text x="1020" y="533" class="small">There is no single replacement service and no compatibility shim.</text>

  <!-- Proven example -->
  <text x="70" y="615" class="band" fill="#0f172a">PROVEN SAFE SHAPE — SYNTHETIC SUPPORT-TICKET LAB</text>
  <rect x="70" y="625" width="295" height="125" rx="16" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
  <text x="95" y="665" class="node-title" fill="#0f172a">Host controller</text>
  <text x="95" y="695" class="node-body">Loads fixture and holds</text>
  <text x="95" y="720" class="node-body">Gateway auth/context</text>

  <rect x="490" y="625" width="245" height="125" rx="16" fill="#fffbeb" stroke="#b45309" stroke-width="3"/>
  <text x="515" y="665" class="node-title" fill="#92400e">3 × llm-task</text>
  <text x="515" y="695" class="node-body">triage · draft · review</text>
  <text x="515" y="720" class="small" fill="#15803d">✓ direct path proven</text>

  <rect x="865" y="625" width="245" height="125" rx="16" fill="#f1f5f9" stroke="#334155" stroke-width="3"/>
  <text x="890" y="665" class="node-title" fill="#0f172a">Deterministic helper</text>
  <text x="890" y="695" class="node-body">validate · normalize</text>
  <text x="890" y="720" class="node-body">hash · package exact payload</text>

  <rect x="1240" y="625" width="245" height="125" rx="16" fill="#f5f3ff" stroke="#6d28d9" stroke-width="3"/>
  <text x="1265" y="665" class="node-title" fill="#5b21b6">Lobster approval</text>
  <text x="1265" y="695" class="node-body">preview · pause · persist</text>
  <text x="1265" y="720" class="node-body">approve / deny · resume</text>

  <rect x="1605" y="625" width="125" height="125" rx="16" fill="#ecfdf5" stroke="#15803d" stroke-width="3"/>
  <text x="1625" y="665" class="node-title" fill="#166534">Artifact</text>
  <text x="1625" y="695" class="node-body">local</text>
  <text x="1625" y="720" class="node-body">inert</text>

  <!-- Bottom notes -->
  <rect x="70" y="875" width="1640" height="150" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="100" y="915" class="callout-title">Read this first</text>
  <text x="100" y="947" class="callout">1. TaskFlow is removed, not merely disabled. Rewrite old call sites against the appropriate current owner.</text>
  <text x="100" y="976" class="callout">2. llm-task output is untrusted until validated; it never controls flow or performs side effects.</text>
  <text x="100" y="1005" class="callout">3. Current workaround: collect judgment outside embedded Lobster, then pass the exact typed package into its approval path.</text>

  <rect x="1260" y="1050" width="18" height="18" fill="#e2e8f0" stroke="#334155"/><text x="1288" y="1065" class="small">deterministic</text>
  <rect x="1390" y="1050" width="18" height="18" fill="#fffbeb" stroke="#b45309"/><text x="1418" y="1065" class="small">judgment</text>
  <rect x="1500" y="1050" width="18" height="18" fill="#f5f3ff" stroke="#6d28d9"/><text x="1528" y="1065" class="small">human gate</text>
  <line x1="1625" y1="1059" x2="1660" y2="1059" stroke="#b91c1c" stroke-width="3" stroke-dasharray="7 5"/><text x="1670" y="1065" class="small">unsupported</text>
</svg>
